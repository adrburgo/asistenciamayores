<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Mayores — Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    nav {
      background: #2b4a8b;
      color: white;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 1.5rem;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    nav .brand {
      font-size: 1.1rem;
      font-weight: 700;
      margin-right: 2rem;
      white-space: nowrap;
    }
    nav a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      padding: 0 1rem;
      height: 56px;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      transition: color 0.15s, background 0.15s;
    }
    nav a:hover, nav a.active {
      color: white;
      background: rgba(255,255,255,0.1);
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #2d3748; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: #4a5568; }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-online  { background: #c6f6d5; color: #276749; }
    .badge-offline { background: #fed7d7; color: #9b2c2c; }
    .badge-processing, .badge-executing { background: #fefcbf; color: #744210; }
    .badge-unknown { background: #e2e8f0; color: #4a5568; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.6rem 0.8rem; font-size: 0.8rem; color: #718096;
         text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
    td { padding: 0.75rem 0.8rem; border-bottom: 1px solid #f0f4f8; font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f7fafc; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(0.92); }
    .btn-primary { background: #2b4a8b; color: white; }
    .btn-danger  { background: #e53e3e; color: white; }
    .btn-secondary { background: #e2e8f0; color: #4a5568; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #4a5568; }
    .form-group input, .form-group select {
      padding: 0.5rem 0.7rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: border-color 0.15s;
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #2b4a8b;
    }
    .form-group small { font-size: 0.75rem; color: #a0aec0; }

    .form-full { grid-column: 1 / -1; }

    .alert-danger {
      background: #fff5f5;
      border: 1.5px solid #fc8181;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      color: #c53030;
      font-size: 0.9rem;
    }

    .tabs { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; }
    .tab-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #718096;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s;
    }
    .tab-btn.active { color: #2b4a8b; border-bottom-color: #2b4a8b; }

    .empty-state {
      text-align: center;
      padding: 2.5rem;
      color: #a0aec0;
      font-size: 0.95rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🏠 Asistencia Mayores</span>
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Panel</a>
    <a href="/cameras" class="{{ 'active' if active == 'cameras' else '' }}">Cámaras</a>
    <a href="/contacts" class="{{ 'active' if active == 'contacts' else '' }}">Contactos</a>
    <a href="{{ ha_url if ha_url is defined else 'http://homeassistant:8123' }}" target="_blank">Home Assistant ↗</a>
    <a href="{{ frigate_url if frigate_url is defined else 'http://frigate:5000' }}" target="_blank">Frigate ↗</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
