mqtt:
  host: mosquitto
  port: 1883
  user: "{FRIGATE_RTSP_PASSWORD}"
  password: "{FRIGATE_RTSP_PASSWORD}"
  topic_prefix: frigate

# Detector de objetos (CPU por defecto, añadir Coral/GPU si disponible)
detectors:
  cpu1:
    type: cpu
    num_threads: 3

# Modelo de detección
model:
  path: /config/model_cache/yolov8n.onnx
  input_tensor: nhwc
  input_pixel_format: rgb
  width: 320
  height: 320
  labelmap_path: /config/model_cache/coco-80.txt

# Grabación
record:
  enabled: true
  retain:
    days: 3
    mode: motion
  events:
    retain:
      default: 10

# Instantáneas al detectar
snapshots:
  enabled: true
  retain:
    default: 10

# Objetos a detectar
objects:
  track:
    - person
  filters:
    person:
      min_score: 0.5
      threshold: 0.7

# Definición de cámaras — EDITAR con las cámaras reales
